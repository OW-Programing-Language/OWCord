name: OWCord CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OWCord
        uses: actions/checkout@v4
      - name: Checkout OW
        uses: actions/checkout@v4
        with:
          repository: OW-Programing-Language/ow-lang
          path: ow-lang
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install OW compiler
        run: mvn -B -ntp -f ow-lang/pom.xml -DskipTests install
      - name: Test Java runtime bridge
        run: mvn -B -ntp -f runtime-bridge/pom.xml verify
      - name: Install flOW
        run: java -jar ow-lang/target/OwIDE.jar deps install
      - name: OW type checks
        run: |
          java -jar ow-lang/target/OwIDE.jar check tests/headless_contracts.ow
          java -jar ow-lang/target/OwIDE.jar check examples/ping_bot/main.ow
          java -jar ow-lang/target/OwIDE.jar check examples/live_smoke/main.ow
          java -jar ow-lang/target/OwIDE.jar check examples/command_router/main.ow
          java -jar ow-lang/target/OwIDE.jar check examples/components_demo/main.ow
          java -jar ow-lang/target/OwIDE.jar check examples/permissions_demo/main.ow
          java -jar ow-lang/target/OwIDE.jar check examples/advanced_commands/main.ow
          java -jar ow-lang/target/OwIDE.jar check examples/guild_inspect/main.ow
          java -jar ow-lang/target/OwIDE.jar check examples/moderation_inspect/main.ow
          java -jar ow-lang/target/OwIDE.jar check examples/components_v2_demo/main.ow
          java -jar ow-lang/target/OwIDE.jar check examples/gateway_cache/main.ow
          java -jar ow-lang/target/OwIDE.jar check examples/shard_status/main.ow
          java -jar ow-lang/target/OwIDE.jar check examples/rest_diagnostics/main.ow
          java -jar ow-lang/target/OwIDE.jar check examples/advent_calendar/main.ow
      - name: OW contract test
        run: java -jar ow-lang/target/OwIDE.jar run tests/headless_contracts.ow
      - name: OW v0.2 command and event unit tests
        run: java -jar ow-lang/target/OwIDE.jar test tests/
  storage-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: owcord
          POSTGRES_PASSWORD: owcord-test
          POSTGRES_DB: owcord
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U owcord -d owcord"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: owcord-root-test
          MYSQL_DATABASE: owcord
          MYSQL_USER: owcord
          MYSQL_PASSWORD: owcord-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: owcord-root-test
          MARIADB_DATABASE: owcord
          MARIADB_USER: owcord
          MARIADB_PASSWORD: owcord-test
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OW-Programing-Language/ow-lang
          path: ow-lang
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn -B -ntp -f ow-lang/pom.xml -DskipTests install
      - name: Test real database providers
        env:
          OWCORD_STORAGE_USER: owcord
          OWCORD_STORAGE_PASSWORD: owcord-test
          OWCORD_STORAGE_MONGO_URI: mongodb://127.0.0.1:27017
          OWCORD_STORAGE_MONGO_DATABASE: owcord
        run: |
          OWCORD_STORAGE_INTEGRATION=postgresql OWCORD_STORAGE_JDBC_URL=jdbc:postgresql://127.0.0.1:5432/owcord mvn -B -ntp -f runtime-bridge/pom.xml -Dtest=DailyRewardStorageTest#externalProvidersWhenConfigured test
          OWCORD_STORAGE_INTEGRATION=mysql OWCORD_STORAGE_JDBC_URL='jdbc:mysql://127.0.0.1:3306/owcord?allowPublicKeyRetrieval=true&sslMode=DISABLED' mvn -B -ntp -f runtime-bridge/pom.xml -Dtest=DailyRewardStorageTest#externalProvidersWhenConfigured test
          OWCORD_STORAGE_INTEGRATION=mariadb OWCORD_STORAGE_JDBC_URL=jdbc:mariadb://127.0.0.1:3307/owcord mvn -B -ntp -f runtime-bridge/pom.xml -Dtest=DailyRewardStorageTest#externalProvidersWhenConfigured test
          OWCORD_STORAGE_INTEGRATION=mongodb mvn -B -ntp -f runtime-bridge/pom.xml -Dtest=DailyRewardStorageTest#externalProvidersWhenConfigured test
